name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 and cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ensure Maven wrapper is executable
        run: |
          chmod +x ./services/mvnw || true

      - name: Run Maven tests for all services (JUnit)
        run: |
          # Run tests from the aggregator pom inside services
          ./services/mvnw -f ./services/pom.xml -B -V package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Compose up (build & start)
        run: |
          # Use docker compose plugin; fallback to docker-compose if necessary
          if command -v docker >/dev/null 2>&1; then
            echo "Using docker compose to bring up services"
            docker compose --profile ci up -d --build
          else
            echo "Docker not found"
            exit 1
          fi

      - name: Wait for services to be healthy / running
        run: |
          set -euo pipefail
          # Pick docker compose command (v2 plugin) or docker-compose
          if command -v docker-compose >/dev/null 2>&1; then
            DC="docker-compose"
          else
            DC="docker compose"
          fi

          echo "Using: $DC"
          services=$($DC config --services)
          echo "Services in compose file: $services"

          for s in $services; do
            echo "Checking service: $s"
            
            # cassandra-init is a one-time service that should complete successfully
            if [ "$s" = "cassandra-init" ]; then
              completed=0
              # Wait up to 300 seconds for cassandra-init to complete
              for i in {1..30}; do
                # Check both running and stopped containers
                cid=$($DC ps -a -q $s 2>/dev/null | head -n1 || true)
                if [ -n "$cid" ]; then
                  running=$(docker inspect -f '{{.State.Running}}' "$cid" 2>/dev/null || echo false)
                  exit_code=$(docker inspect -f '{{.State.ExitCode}}' "$cid" 2>/dev/null || echo "")
                  
                  # If container has stopped and exit code is 0, it completed successfully
                  if [ "$running" = "false" ] && [ "$exit_code" = "0" ]; then
                    completed=1
                    echo "Service $s completed successfully (container $cid)"
                    break
                  # If container stopped with non-zero exit code, it failed
                  elif [ "$running" = "false" ] && [ -n "$exit_code" ] && [ "$exit_code" != "0" ] && [ "$exit_code" != "-1" ]; then
                    echo "Service $s exited with code $exit_code"
                    echo "Logs for $s:"
                    docker logs "$cid" || true
                    exit 1
                  fi
                fi
                sleep 10
              done
              if [ "$completed" -ne 1 ]; then
                echo "Service $s failed to complete"
                $DC ps -a || true
                docker ps -a || true
                cid=$($DC ps -a -q $s 2>/dev/null | head -n1 || true)
                if [ -n "$cid" ]; then
                  echo "Logs for $s:"
                  docker logs "$cid" || true
                fi
                exit 1
              fi
            else
              # For other services, check if they're running
              started=0
              # Wait up to 300 seconds per service
              for i in {1..30}; do
                cid=$($DC ps -q $s 2>/dev/null || true)
                if [ -n "$cid" ]; then
                  running=$(docker inspect -f '{{.State.Running}}' "$cid" 2>/dev/null || echo false)
                  if [ "$running" = "true" ]; then
                    started=1
                    echo "Service $s is running (container $cid)"
                    break
                  fi
                fi
                sleep 10
              done
              if [ "$started" -ne 1 ]; then
                echo "Service $s failed to start"
                $DC ps || true
                docker ps || true
                cid=$($DC ps -a -q $s 2>/dev/null | head -n1 || true)
                if [ -n "$cid" ]; then
                  echo "Logs for $s:"
                  docker logs "$cid" || true
                fi
                exit 1
              fi
            fi
          done

      - name: Show docker compose ps
        run: |
          docker compose ps

      - name: Integration test - Shorten URL and redirect
        run: |
          set -euo pipefail
          
          # Wait for application to be ready
          echo "Waiting for application to be ready..."
          for i in {1..30}; do
            if curl -f -s http://localhost/actuator/health > /dev/null 2>&1; then
              echo "Application is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Application failed to become ready"
              docker compose logs app-service || true
              exit 1
            fi
            echo "Waiting for application... ($i/30)"
            sleep 5
          done
          
          # Test data
          ORIGINAL_URL="https://www.example.com/very/long/path?param=value"
          
          # Step 1: POST request to shorten URL
          echo "Making POST request to shorten URL..."
          RESPONSE=$(curl -s -X POST http://localhost/url \
            -H "Content-Type: application/json" \
            -d "{\"url\": \"$ORIGINAL_URL\"}")
          
          echo "POST response: $RESPONSE"
          
          # Extract shortenUrl from JSON response using Python
          SHORTEN_URL=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin)['url'])")
          
          if [ -z "$SHORTEN_URL" ]; then
            echo "Failed to extract shortenUrl from response: $RESPONSE"
            exit 1
          fi
          
          echo "Shorten URL: $SHORTEN_URL"
          
          # Extract uniqueCode from shortenUrl (format: http://host/url/{uniqueCode})
          UNIQUE_CODE=$(echo "$SHORTEN_URL" | sed 's|.*/url/||')
          
          if [ -z "$UNIQUE_CODE" ]; then
            echo "Failed to extract uniqueCode from shortenUrl: $SHORTEN_URL"
            exit 1
          fi
          
          echo "Unique code: $UNIQUE_CODE"
          
          # Step 2: GET request to check redirect (without following redirect)
          echo "Making GET request to check redirect..."
          GET_RESPONSE=$(curl -s -w "\n%{http_code}" -I http://localhost/url/"$UNIQUE_CODE")
          GET_HTTP_CODE=$(echo "$GET_RESPONSE" | tail -n1)
          GET_HEADERS=$(echo "$GET_RESPONSE" | sed '$d')
          
          LOCATION=$(echo "$GET_HEADERS" | grep -i "^location:" | cut -d' ' -f2- | tr -d '\r')
          
          echo "GET status code: $GET_HTTP_CODE"
          echo "Location header: $LOCATION"
          
          # Verify redirect
          if [ "$GET_HTTP_CODE" != "301" ]; then
            echo "❌ Expected status code 301, got $GET_HTTP_CODE"
            echo "Response headers: $GET_HEADERS"
            docker compose logs app-service || true
            exit 1
          fi
          
          if [ "$LOCATION" != "$ORIGINAL_URL" ]; then
            echo "❌ Expected Location header: $ORIGINAL_URL"
            echo "Got Location header: $LOCATION"
            docker compose logs app-service || true
            exit 1
          fi
          
          echo "✓ Integration test passed: URL shortened and redirect works correctly"